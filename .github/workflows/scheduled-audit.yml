# .github/workflows/scheduled-audit.yml
# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULED WEEKLY DEPENDENCY AUDIT
#
# Why this exists separately from ci.yml:
#   The CI audit only runs on push/PR. A CVE can be disclosed at any time —
#   your dependency tree may be safe when you merge a PR on Monday but
#   vulnerable by Wednesday when a new advisory is published.
#
#   This workflow runs every Monday at 09:00 UTC (before the work week starts)
#   and creates a GitHub Issue if any vulnerabilities are found. This ensures
#   the team is notified of new CVEs even with no recent code changes.
#
# Can also be triggered manually via the Actions tab.
# ─────────────────────────────────────────────────────────────────────────────

name: Scheduled Dependency Audit

on:
  # Every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # Required to create the report issue

jobs:
  weekly-audit:
    name: Weekly npm audit + OSV scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install from the root workspace lockfile
        run: npm ci --ignore-scripts

      # Continue only long enough to publish evidence and create an issue;
      # the final step restores the audit failure to the job status.
      - name: Collect root lockfile audit (full and production-only)
        id: collect
        run: node scripts/collect-dependency-audit.js --report-dir /tmp/patchticker-audit
        continue-on-error: true

      # Parse audit JSON and build a human-readable summary for the issue body
      - name: Parse audit results
        id: parse
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const audit = require('/tmp/patchticker-audit/summary.json');
          if ([audit.all, audit.production].some(item => item.state === 'error')) {
            throw new Error('Dependency scanner failed; see audit artifact and workflow logs');
          }
          const count = item => item.counts.moderate + item.counts.high + item.counts.critical;
          console.log(`has_vulnerabilities=${audit.all.state === 'vulnerable' || audit.production.state === 'vulnerable'}`);
          console.log(`summary=Root lockfile: ${count(audit.all)} moderate+ findings; production-only: ${count(audit.production)} moderate+ findings.`);
          NODE

      # Run OSV scanner as a second scan source
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json

      # Upload audit artefacts regardless of pass/fail
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-audit-${{ github.run_id }}
          path: |
            /tmp/patchticker-audit/
          if-no-files-found: error
          retention-days: 90

      # Create a GitHub Issue only when vulnerabilities are found.
      # The issue is labelled 'security' and assigned to help with triage.
      # Uses the built-in GITHUB_TOKEN — no additional secrets needed.
      - name: Create vulnerability issue
        if: always() && steps.parse.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.parse.outputs.summary }}`;
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const date = new Date().toISOString().split('T')[0];

            const body = [
              `## 🔴 Dependency Vulnerabilities Found — ${date}`,
              ``,
              `**Summary:** ${summary}`,
              ``,
              `### What to do`,
              `1. Review the full and production-only reports in the [workflow run](${runUrl})`,
              `2. Run \`npm run audit\` from the repository root`,
              `3. Run \`npm run audit:fix\` where safe to do so`,
              `4. For breaking-change fixes, review changelog and update manually`,
              `5. Check [npm advisories](https://www.npmjs.com/advisories) for context`,
              ``,
              `### Quick commands`,
              `\`\`\`bash`,
              `# Check details`,
              `npm run audit`,
              `npm run audit:production`,
              ``,
              `# Fix automatically (non-breaking only)`,
              `npm run audit:fix`,
              `\`\`\``,
              ``,
              `---`,
              `*This issue was created automatically by the [scheduled audit workflow](${runUrl}).*`,
            ].join('\n');

            // Check if an open issue already exists for this week to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open',
            });

            const alreadyExists = existing.data.some(i =>
              i.title.includes('Dependency Vulnerabilities Found') &&
              i.title.includes(date)
            );

            if (!alreadyExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 Dependency Vulnerabilities Found — ${date}`,
                body,
                labels: ['security', 'automated', 'dependencies'],
              });
            }

      - name: Fail on vulnerability findings or scanner errors
        if: always()
        run: test '${{ steps.collect.outcome }}' = 'success'
